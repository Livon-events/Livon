<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Selector</title>
    <link rel="stylesheet" href="category_selector.css">
</head>

<body>
    <nav class="category-nav">
        <ul class="category-list">
            <li class="category-item">
                <button class="category-btn active">Nightlife</button>
            </li>
            <li class="category-item">
                <button class="category-btn">Sports</button>
            </li>
            <li class="category-item">
                <button class="category-btn">Arts and Culture</button>
            </li>
            <li class="category-item">
                <button class="category-btn">Music</button>
            </li>
            <!-- More categories -->
        </ul>
    </nav>

    <script>
        const categoryList = document.querySelector('.category-list');

        categoryList.addEventListener('click', (e) => {
            const clickedBtn = e.target.closest('.category-btn');
            if (!clickedBtn) return;

            categoryList.querySelector('.category-btn.active')?.classList.remove('active');
            clickedBtn.classList.add('active');
        });
    </script>

</body>

</html>
