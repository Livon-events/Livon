<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Header</title>
    <link rel="stylesheet" href="phone_header.css">
    <!-- Premium font for a polished app appearance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container">
            <!-- Logo Icon with white background -->
            <div class="logo-box">
                <svg viewBox="0 0 100 100" class="logo-svg">
                    <rect width="100" height="100" rx="12" fill="white" />
                    <!-- Interlocking Rings -->
                    <ellipse cx="40" cy="50" rx="14" ry="24" transform="rotate(-30 40 50)" stroke="black" stroke-width="5" fill="none" />
                    <ellipse cx="60" cy="50" rx="14" ry="24" transform="rotate(-30 60 50)" stroke="black" stroke-width="5" fill="none" />
                    <!-- Overlay to interlock the rings -->
                    <path d="M 43 27 A 14 24 0 0 1 52 35" stroke="white" stroke-width="6" fill="none" transform="rotate(-30 40 50)" />
                    <ellipse cx="40" cy="50" rx="14" ry="24" transform="rotate(-30 40 50)" stroke="black" stroke-width="5" fill="none" />
                </svg>
            </div>

            <!-- Hierarchical Location Filter Trigger -->
            <div class="location-filter" id="locationFilterBtn">
                <span class="city" id="displayCity">Maseru</span>
                <span class="area" id="displayArea">Maseru central</span>
            </div>

            <!-- Rounded Search capsule matching your layout -->
            <div class="search-bar">
                <span class="search-placeholder">Search</span>
                <div class="search-icon-circle">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- Bottom Sheet Modal for Location Selector -->
    <div class="bottom-sheet-overlay" id="sheetOverlay">
        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-header">
                <div class="sheet-indicator"></div>
                <h3 id="sheetTitle">Select Area in Maseru</h3>
                <button class="close-btn" id="closeSheetBtn">&times;</button>
            </div>
            
            <div class="sheet-body">
                <ul class="location-list" id="areaList">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Script to handle Area selection interactions -->
    <script>
        // Interactive Areas database for Maseru
        const maseruAreas = ["All areas", "Maseru central", "Thetsane", "Hillsview", "Khubetsoana"];

        let selectedArea = "Maseru central";

        // DOM elements
        const locationFilterBtn = document.getElementById('locationFilterBtn');
        const sheetOverlay = document.getElementById('sheetOverlay');
        const bottomSheet = document.getElementById('bottomSheet');
        const closeSheetBtn = document.getElementById('closeSheetBtn');
        const areaList = document.getElementById('areaList');

        const displayArea = document.getElementById('displayArea');

        // Render areas list
        function renderAreas() {
            areaList.innerHTML = '';
            maseruAreas.forEach(area => {
                const li = document.createElement('li');
                const isActive = (area === selectedArea);
                li.className = `location-item ${isActive ? 'active' : ''}`;
                li.innerHTML = `
                    <span>${area}</span>
                    ${isActive ? '<span class="check-mark">&#10003;</span>' : ''}
                `;
                li.addEventListener('click', () => selectArea(area));
                areaList.appendChild(li);
            });
        }

        function selectArea(area) {
            selectedArea = area;
            
            // Update header UI
            displayArea.textContent = selectedArea;

            closeLocationSheet();
        }

        function openLocationSheet() {
            sheetOverlay.classList.add('show');
            bottomSheet.classList.add('show');
            renderAreas();
            document.body.style.overflow = 'hidden';
        }

        function closeLocationSheet() {
            sheetOverlay.classList.remove('show');
            bottomSheet.classList.remove('show');
            document.body.style.overflow = '';
        }

        // Event listeners
        locationFilterBtn.addEventListener('click', openLocationSheet);
        closeSheetBtn.addEventListener('click', closeLocationSheet);
        sheetOverlay.addEventListener('click', (e) => {
            if (e.target === sheetOverlay) closeLocationSheet();
        });
    </script>
</body>

</html>
