<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peek</title>
    <link rel="stylesheet" href="peek_list.css">
    <!-- Premium Outfit font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="peek-container">
        <!-- View Event Button -->
        <button class="view-event-btn" type="button">View Event</button>

        <!-- Interests Heading -->
        <div class="interests-header">
            <h1>Interests</h1>
            <span class="count-badge">15+</span>
        </div>

        <!-- Connections Attending Section -->
        <div class="peek-section">
            <div class="section-title-row">
                <span class="section-title">Connections attending</span>
                <span class="count-badge">4</span>
            </div>
            <div class="divider"></div>
            <div class="connections-list">
                <!-- Person A -->
                <div class="connection-row">
                    <div class="connection-info">
                        <div class="avatar"></div>
                        <span class="username">@personA</span>
                    </div>
                </div>
                <!-- Person B -->
                <div class="connection-row">
                    <div class="connection-info">
                        <div class="avatar"></div>
                        <span class="username">@personB</span>
                    </div>
                </div>
                <!-- Person C -->
                <div class="connection-row">
                    <div class="connection-info">
                        <div class="avatar"></div>
                        <span class="username">@personC</span>
                    </div>
                </div>
                <!-- Person D -->
                <div class="connection-row">
                    <div class="connection-info">
                        <div class="avatar"></div>
                        <span class="username">@personD</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
