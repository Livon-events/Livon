<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Own View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --surface: #17181A;
            --surface-2: #1F2023;
            --text-primary: #ffffff;
            --text-secondary: #AEAEB2;
            --accent-yellow: #FFE600;
            --accent-yellow-hover: #FFF066;
            --accent-magenta: #d11a8c;

            --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            /* establishes the stacking context the Links overlay positions against */
            position: relative;
        }

        /* Header */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            background-color: var(--accent-magenta);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .username {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.6px;
        }

        .connections-count {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .profile-divider {
            border: none;
            height: 2px;
            background-color: var(--accent-yellow);
            width: 100%;
            margin-bottom: 16px;
        }

        /* Links section — sits at the top of the flow, its dropdown overlays everything below */
        .links-section {
            position: relative;
            z-index: 20;
            margin-bottom: 28px;
        }

        .links-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .links-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
            padding: 4px 0;
        }

        .links-toggle svg {
            width: 18px;
            height: 18px;
            transition: transform 0.2s ease;
        }

        .links-toggle[aria-expanded="true"] svg {
            transform: rotate(180deg);
        }

        .btn-edit {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            background-color: var(--surface-2);
            color: var(--text-primary);
            cursor: pointer;
        }

        /* The dropdown itself: absolutely positioned so it floats on top of the
   Connections/Events content below instead of pushing it down. */
        .links-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--surface);
            border: 1px solid var(--surface-2);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
        }

        .links-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .link-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .link-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .link-icon svg {
            width: 22px;
            height: 22px;
        }

        .link-input {
            flex: 1;
            height: 48px;
            background-color: var(--surface-2);
            border: 2px solid var(--surface-2);
            border-radius: 12px;
            padding: 0 14px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 15px;
            outline: none;
        }

        .link-input::placeholder {
            color: var(--text-secondary);
        }

        .link-input:focus {
            border-color: var(--accent-yellow);
        }

        .link-go {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border: none;
            border-radius: 12px;
            background-color: var(--accent-yellow);
            color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .link-go svg {
            width: 20px;
            height: 20px;
        }

        /* Backdrop that closes the dropdown on outside click, sits under the dropdown
   but above the Connections/Events content */
        .links-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
        }

        .links-backdrop.open {
            display: block;
        }

        /* Connections / Events — lives below Links in normal document flow, so it
   never depends on the dropdown's open/closed state */
        .tabs-section {
            position: relative;
            z-index: 1;
        }

        .tab-bar {
            display: flex;
            background-color: var(--surface);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: none;
            border: none;
            border-radius: 9px;
            padding: 12px;
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: #000000;
            color: var(--text-primary);
        }

        .tab-count {
            background-color: var(--accent-yellow);
            color: var(--bg-color);
            font-size: 13px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .connections-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .connection-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background-color: var(--surface);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .connection-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--accent-magenta);
            flex-shrink: 0;
        }

        .connection-name {
            flex: 1;
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 700;
        }

        .btn-remove {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            background-color: var(--accent-yellow);
            color: var(--bg-color);
            cursor: pointer;
        }

        @media (max-width: 380px) {
            .username {
                font-size: 22px;
            }

            .profile-avatar {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>

<body>

    <div class="profile-container">

        <div class="profile-header">
            <div class="profile-avatar"></div>
            <div class="profile-info">
                <div class="username">User2026</div>
                <div class="connections-count">3 connections</div>
            </div>
        </div>

        <hr class="profile-divider">

        <!-- LINKS: dropdown floats above the Connections/Events section on click -->
        <div class="links-section">
            <div class="links-row">
                <button class="links-toggle" id="linksToggle" aria-expanded="false">
                    Links
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <button class="btn-edit">Edit</button>
            </div>

            <div class="links-dropdown" id="linksDropdown">
                <div class="link-row">
                    <div class="link-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M16.6 5.82c-1.02-.9-1.6-2.2-1.6-3.62h-3.2v13.9c0 1.6-1.3 2.9-2.9 2.9s-2.9-1.3-2.9-2.9 1.3-2.9 2.9-2.9c.3 0 .58.05.85.13V9.98a6.1 6.1 0 0 0-.85-.06 6.1 6.1 0 1 0 6.1 6.1V9.1a9.3 9.3 0 0 0 5.4 1.72V7.6c-1.5 0-2.85-.5-3.7-1.78z" />
                        </svg>
                    </div>
                    <input class="link-input" type="text" placeholder="tiktok.com/@username">
                    <button class="link-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg></button>
                </div>
                <div class="link-row">
                    <div class="link-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="5" />
                            <circle cx="12" cy="12" r="4" />
                            <circle cx="17.5" cy="6.5" r="1" />
                        </svg>
                    </div>
                    <input class="link-input" type="text" placeholder="instagram.com/username">
                    <button class="link-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg></button>
                </div>
                <div class="link-row">
                    <div class="link-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M13.5 21v-7.5h2.5l.4-3H13.5V8.5c0-.9.25-1.5 1.55-1.5H16.5V4.3C16.2 4.26 15.2 4.17 14 4.17c-2.4 0-4 1.46-4 4.14V10.5H7.5v3H10V21h3.5z" />
                        </svg>
                    </div>
                    <input class="link-input" type="text" placeholder="facebook.com/username">
                    <button class="link-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg></button>
                </div>
            </div>
        </div>

        <!-- CONNECTIONS / EVENTS: below Links in normal flow -->
        <div class="tabs-section">
            <div class="tab-bar">
                <button class="tab-btn active" id="tabConnections">
                    Connections <span class="tab-count">659</span>
                </button>
                <button class="tab-btn" id="tabEvents">
                    Events
                </button>
            </div>

            <div class="connections-list" id="connectionsList">
                <div class="connection-row">
                    <div class="connection-avatar"></div>
                    <div class="connection-name">mave</div>
                    <button class="btn-remove">remove</button>
                </div>
                <div class="connection-row">
                    <div class="connection-avatar"></div>
                    <div class="connection-name">mave</div>
                    <button class="btn-remove">remove</button>
                </div>
            </div>
        </div>

    </div>

    <div class="links-backdrop" id="linksBackdrop"></div>

    <script>
        const toggle = document.getElementById('linksToggle');
        const dropdown = document.getElementById('linksDropdown');
        const backdrop = document.getElementById('linksBackdrop');

        function openLinks() {
            dropdown.classList.add('open');
            backdrop.classList.add('open');
            toggle.setAttribute('aria-expanded', 'true');
        }

        function closeLinks() {
            dropdown.classList.remove('open');
            backdrop.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
        }

        toggle.addEventListener('click', () => {
            const isOpen = dropdown.classList.contains('open');
            isOpen ? closeLinks() : openLinks();
        });

        backdrop.addEventListener('click', closeLinks);
    </script>

</body>

</html>
