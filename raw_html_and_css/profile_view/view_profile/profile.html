<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - User2026</title>
    <link rel="stylesheet" href="profile.css">
    <!-- Premium Outfit & Inter fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="profile-container">
        <!-- Profile Header Section -->
        <header class="profile-header">
            <div class="profile-avatar-wrapper">
                <div class="profile-avatar"></div>
            </div>
            <div class="profile-info">
                <h1 class="username">User2026</h1>
                <p class="connections-count">3 connections</p>
            </div>
        </header>

        <!-- Biography Section -->
        <section class="profile-bio">
            <p class="bio-text">This is the place holder for the bio</p>
        </section>

        <!-- Accent Divider Line -->
        <hr class="profile-divider">

        <!-- Action Buttons (Connect and Links) -->
        <div class="profile-actions">
            <button class="btn btn-connect" type="button">Connect</button>
            <button class="btn btn-links" type="button">Links</button>
        </div>

        <!-- Featured Event Card -->
        <section class="event-showcase">
            <div class="event-card">
                <div class="event-image-placeholder"></div>
                <div class="event-content">
                    <div class="event-meta">
                        <span class="event-tag-today">Today</span>
                        <div class="event-location">
                            <!-- Premium Location Pin SVG -->
                            <svg class="location-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <span class="location-text">Limkokwing</span>
                        </div>
                    </div>
                    <h2 class="event-title">All white Festival</h2>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
